<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>AGY Quota Settings</title>
    <style>
        body { font-family: sans-serif; font-size: 10pt; color: white; background-color: transparent; }
        .wrap { padding: 10px; box-sizing: border-box; }
        .row { margin-bottom: 8px; }
        label { display: block; margin-bottom: 2px; color: #ccc; }
        select { width: 100%; box-sizing: border-box; background: #333; color: white; border: 1px solid #555; padding: 3px 5px; border-radius: 3px; }
        #saveButton { margin-top: 10px; width: 100%; padding: 5px; cursor: pointer; background: #5C8ACC; border: none; color: white; border-radius: 3px; }
        #saveButton:hover { background: #3D6BB5; }
        #status { font-size: 9pt; color: #88cc88; height: 1.2em; }
        .hint { font-size: 8pt; color: #888; margin-top: 2px; }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="row">
            <div id="displayValue" style="background: #222; padding: 8px; border-radius: 3px; border: 1px solid #444; color: #fff; font-weight: bold; text-align: center; margin-bottom: 10px;">Waiting for data...</div>
        </div>
        <div class="row">
            <label for="bucketId">Quota Group and Window:</label>
            <select id="bucketId"><option value="">Automatic (highest usage)</option></select>
            <p class="hint" id="bucketStatus">Read quota choices from AGY...</p>
        </div>
        <div class="row">
            <label for="displayMode">Display Mode:</label>
            <select id="displayMode" style="width: 100%; box-sizing: border-box; background: #333; color: white; border: 1px solid #555; padding: 3px 5px; border-radius: 3px;">
                <option value="quota">Usage Percentage</option>
                <option value="aiCredits">AI Credits</option>
            </select>
            <p class="hint">Select what to display on the button.</p>
        </div>
        <div class="row">
            <button id="saveButton">Save Settings</button>
        </div>
        <p id="status"></p>
        <p class="hint">Requires AGY CLI 1.1.11 or later. Sign in through AGY under the same user account as Stream Deck. This action queries AGY directly every five minutes. Press the button to refresh.</p>
    </div>

    <script>
        let websocket = null;
        let pluginUUID = null;
        let actionInfo = {};
        let savedSettings = {};
        let buckets = [];

        function showBuckets(selectedId = savedSettings.bucketId || '') {
            const select = document.getElementById('bucketId');
            select.replaceChildren(new Option(savedSettings.modelLabel
                ? 'Automatic (previous model: ' + savedSettings.modelLabel + ')'
                : 'Automatic (highest usage)', ''));
            for (const bucket of buckets) {
                select.add(new Option(bucket.group + ' / ' + bucket.window + ' / ' + bucket.name, bucket.id));
            }
            if (selectedId && !buckets.some(bucket => bucket.id === selectedId)) {
                select.add(new Option('Unavailable: ' + selectedId, selectedId));
            }
            select.value = selectedId;
        }

        function sendToPlugin(payload) {
            websocket.send(JSON.stringify({ event: 'sendToPlugin', action: actionInfo.action, context: pluginUUID, payload }));
        }

        function connectElgatoStreamDeckSocket(inPort, inPluginUUID, inRegisterEvent, inInfo, inActionInfo) {
            pluginUUID = inPluginUUID;
            actionInfo = JSON.parse(inActionInfo);

            websocket = new WebSocket('ws://127.0.0.1:' + inPort);

            websocket.onopen = function () {
                websocket.send(JSON.stringify({
                    "event": inRegisterEvent,
                    "uuid": pluginUUID
                }));

                websocket.send(JSON.stringify({
                    "event": "getSettings",
                    "context": pluginUUID
                }));
                sendToPlugin({ type: 'getAgyBuckets' });
            };

            websocket.onmessage = function (evt) {
                const jsonObj = JSON.parse(evt.data);
                if (jsonObj.event === 'didReceiveSettings') {
                    savedSettings = jsonObj.payload.settings || {};
                    document.getElementById('displayMode').value = savedSettings.displayMode || 'quota';
                    showBuckets();
                } else if (jsonObj.event === 'sendToPropertyInspector') {
                    if (jsonObj.payload && jsonObj.payload.type === 'updateDisplay') {
                        document.getElementById('displayValue').innerText = jsonObj.payload.value;
                    } else if (jsonObj.payload && jsonObj.payload.type === 'agyBuckets') {
                        buckets = jsonObj.payload.buckets || [];
                        showBuckets(document.getElementById('bucketId').value);
                        document.getElementById('bucketStatus').innerText = jsonObj.payload.error
                            || 'Each choice selects one quota window. Automatic shows the highest usage.';
                    }
                }
            };

            document.getElementById('saveButton').addEventListener('click', function () {
                const payload = {
                    bucketId: document.getElementById('bucketId').value,
                    displayMode: document.getElementById('displayMode').value
                };
                websocket.send(JSON.stringify({
                    "event": "setSettings",
                    "context": pluginUUID,
                    "payload": payload
                }));
                const status = document.getElementById('status');
                status.innerText = "Saved!";
                setTimeout(() => status.innerText = "", 2000);
            });
        }
    </script>
</body>

</html>
